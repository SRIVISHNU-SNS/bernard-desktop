[package]
name = "bernard"
version = "0.2.0"
description = "Bernard, a local desktop companion"
authors = ["Bernard"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "bernard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "process", "io-util", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
] }
xcap = "0.9.8"
arboard = { version = "3", features = ["image-data"] }
dirs = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
rand = "0.9"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
